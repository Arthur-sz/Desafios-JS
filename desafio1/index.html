<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Caixa de mercado</title>
</head>
<body>
    <div class="container">

        <div class="valores">
            <div class="campo">
                <label for="valor1">valor 1</label>
                <input type="number" id="valor1" placeholder="Digite o primeiro valor!">
            </div>

            <div class="campo">
                <label for="valor2">valor 2</label>
                <input type="number" id="valor2" placeholder="Digite o segundo valor!">    <br>
            </div>
        </div>

        <div class="botao">
            <button id="calcular">Calcular</button> <br>
        </div>

        <div class="resultados">
            <p id="soma">Soma</p>
            <p id="subtracao">subtração</p>
            <p id="multiplicacao">multiplicação</p>
            <p id="divisao">divisão</p>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de imc
    </title>
</head>
<body>
    <div class="container">
        <div class="entrada">
            <label>Peso (Kg)</label>
            <input type="number" id="peso" placeholder="digite o seu peso">

            <label>Altura (m)</label>
            <input type="number" id="altura" placeholder="digite sua altura">
        </div>

        <button id="calcular">Calcular imc</button>
        
        <div class="resultados">
            <p id="imc">Resultado imc:</p>
            <p id="classificacao">classificação</p>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
